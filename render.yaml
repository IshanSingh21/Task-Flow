services:
  # TaskFlow Express API Web Service
  - type: web
    name: taskflow-api
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --skip-generate && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  # Managed Redis Instance
  - type: redis
    name: taskflow-redis
    plan: starter
    ipAllowList: []

# Managed PostgreSQL Database
databases:
  - name: taskflow-db
    plan: starter
    databaseName: taskflow
    user: taskflow_admin
